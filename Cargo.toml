[package]
name = "eval_split_guard"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Privacy-first offline leakage checks for evaluation dataset splits"
repository = "https://github.com/Tinkora/eval_split_guard"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.12"
