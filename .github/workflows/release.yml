name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate metadata and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          grep -Fq "## [${version}]" CHANGELOG.md
          tag_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          [[ "${tag_type}" == "tag" ]] || {
            echo "release tag must be an annotated tag" >&2
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "${GITHUB_SHA}" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]]
          for attempt in {1..40}; do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=10" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA)][0].conclusion // "pending"')"
            [[ "$conclusion" == success ]] && break
            [[ "$conclusion" != failure && "$attempt" -lt 40 ]]
            sleep 15
          done
      - name: Run quality gate
        run: |
          ruby scripts/test_release_workflow.rb
          ruby scripts/test_normalize_cyclonedx_sbom.rb
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --no-self-update
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test --locked
          cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-15, target: x86_64-apple-darwin, ext: "" }
          - { os: macos-15, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.85.0
          cargo +1.85.0 build --release --locked --target "${{ matrix.target }}"
          mkdir dist staging
          cp "target/${{ matrix.target }}/release/eval_split_guard${{ matrix.ext }}" staging/
          cp README.md README.zh-CN.md CHANGELOG.md LICENSE staging/
          tar -czf "dist/eval_split_guard-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C staging .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "eval_split_guard-${{ matrix.target }}", path: "dist/*", if-no-files-found: error, retention-days: 7 }
  evidence:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --describe crate
          ruby scripts/normalize_cyclonedx_sbom.rb eval_split_guard.cdx.json
          mkdir dist
          mv eval_split_guard.cdx.json dist/SBOM.cdx.json
          cargo metadata --locked --format-version 1 | jq '[.packages[] | {name, version, license}]' > dist/LICENSES.json
          jq -n --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" --arg tag "${GITHUB_REF_NAME}" '{schema_version:1,repository:$repository,commit:$sha,tag:$tag}' > dist/RELEASE_EVIDENCE.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: eval_split_guard-evidence, path: "dist/*", if-no-files-found: error, retention-days: 7 }
  publish:
    needs: [build, evidence]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      - name: Verify assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            "eval_split_guard-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "LICENSES.json"
            "RELEASE_EVIDENCE.json"
            "SBOM.cdx.json"
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort) \
            <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort); then
            echo "unexpected release asset inventory" >&2
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            test -s "dist/${asset}"
          done
          (cd dist && sha256sum -- "${expected_assets[@]}" > SHA256SUMS)
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*.tar.gz" }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "dist/*.tar.gz", predicate-type: "https://cyclonedx.org/bom", predicate-path: dist/SBOM.cdx.json }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: dist/RELEASE_EVIDENCE.json, predicate-type: "https://tinkora.dev/attestations/release-evidence/v1", predicate-path: dist/RELEASE_EVIDENCE.json }
      - name: Publish and reverify GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            "eval_split_guard-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.tar.gz"
            "eval_split_guard-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "LICENSES.json"
            "RELEASE_EVIDENCE.json"
            "SBOM.cdx.json"
            "SHA256SUMS"
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort) \
            <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort); then
            echo "unexpected release asset inventory" >&2
            exit 1
          fi

          release_args=(--draft --verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          release_id=""
          draft_created=false
          resolve_draft_release_id() {
            local attempt candidate_output matching_count
            local -a matching_ids
            for attempt in {1..6}; do
              candidate_output=""
              if candidate_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME and .draft == true) | .id')"; then
                matching_ids=()
                while IFS= read -r candidate_id; do
                  [[ -n "${candidate_id}" ]] && matching_ids+=("${candidate_id}")
                done <<< "${candidate_output}"
                matching_count="${#matching_ids[@]}"
                if [[ "${matching_count}" -eq 1 ]]; then
                  printf '%s\n' "${matching_ids[0]}"
                  return 0
                fi
                if [[ "${matching_count}" -gt 1 ]]; then
                  echo "multiple matching drafts found for ${GITHUB_REF_NAME}" >&2
                  return 1
                fi
                [[ "${matching_count}" -eq 0 ]]
              fi
              if [[ "${attempt}" -lt 6 ]]; then
                sleep "$((attempt * 2))"
              fi
            done
            echo "draft did not become visible after bounded retries" >&2
            return 1
          }
          delete_release_with_retry() {
            local candidate_id="$1"
            local attempt
            for attempt in {1..6}; do
              if gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${candidate_id}" >/dev/null; then
                return 0
              fi
              if [[ "${attempt}" -lt 6 ]]; then
                sleep "$((attempt * 2))"
              fi
            done
            echo "failed to delete draft release ${candidate_id} after bounded retries" >&2
            return 1
          }
          cleanup() {
            if [[ "${draft_created}" == true ]]; then
              local candidate_id="${release_id}"
              if [[ -z "${candidate_id}" ]]; then
                if ! candidate_id="$(resolve_draft_release_id)"; then
                  echo "unable to resolve the draft release during cleanup" >&2
                  return 0
                fi
              fi
              if ! delete_release_with_retry "${candidate_id}"; then
                echo "unable to clean up draft release ${candidate_id}" >&2
              fi
            fi
          }
          trap cleanup EXIT

          draft_created=true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          release_id="$(resolve_draft_release_id)"

          mkdir released-assets
          if ! diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort) \
            <(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
              --jq '.[].name' | LC_ALL=C sort); then
            echo "unexpected draft asset inventory" >&2
            exit 1
          fi
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "released-assets/${asset_name}"
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --paginate --jq '.[] | [.id, .name] | @tsv')
          if ! diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort) \
            <(find released-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort); then
            echo "unexpected release asset inventory after download" >&2
            exit 1
          fi
          (cd released-assets && sha256sum --check --strict SHA256SUMS)

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false >/dev/null
          release_id=""
          trap - EXIT
